<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocChat</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1d2330; }
  .hidden { display: none !important; }
  button { background: #4f46e5; color: #fff; border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; }
  button.grey { background: #e5e7eb; color: #333; }
  input { padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
  #login { max-width: 340px; margin: 12vh auto; background: #fff; padding: 24px; border-radius: 12px;
           display: flex; flex-direction: column; gap: 10px; }
  #err { color: #c0392b; font-size: 13px; }
  #app { display: flex; height: 100vh; }
  aside { width: 260px; background: #fff; padding: 16px; overflow-y: auto; border-right: 1px solid #e5e7eb; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 720px; padding: 12px; border-radius: 12px; background: #fff; border: 1px solid #e5e7eb; }
  .msg.user { align-self: flex-end; background: #eef0ff; }
  .body { white-space: pre-wrap; }
  details { font-size: 13px; color: #555; margin-top: 6px; background: #f3f4f6; padding: 6px 10px; border-radius: 8px; }
  form { display: flex; gap: 8px; padding: 14px; background: #fff; border-top: 1px solid #e5e7eb; }
  form input { flex: 1; }
  ul { padding: 0; margin: 8px 0; }
  li { display: flex; justify-content: space-between; font-size: 14px; margin: 6px 0; list-style: none; }
  li button { padding: 0 6px; background: none; color: #999; }
  @media (max-width: 700px) { aside { display: none; } }
</style>
</head>
<body>

<div id="login">
  <h2 style="margin:0">DocChat</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password (min 8 characters)">
  <div id="err"></div>
  <button onclick="auth('login')">Login</button>
  <button class="grey" onclick="auth('register')">Register</button>
</div>

<div id="app" class="hidden">
  <aside>
    <button class="grey" onclick="logout()">Logout</button>
    <h4>Your PDFs</h4>
    <input type="file" id="file" accept="application/pdf">
    <div id="status" style="font-size:13px;color:#666;margin-top:6px"></div>
    <ul id="docs"></ul>
    <button class="grey" onclick="clearChat()">Clear chat</button>
  </aside>
  <main>
    <div id="msgs"></div>
    <form id="form">
      <input id="q" placeholder="Ask a question about your PDFs..." autocomplete="off" maxlength="2000">
      <button>Send</button>
    </form>
  </main>
</div>

<script>
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem("token");
let busy = false;

async function api(path, opts = {}) {
  const { json, ...rest } = opts;
  const headers = token ? { Authorization: "Bearer " + token } : {};
  if (json) { headers["Content-Type"] = "application/json"; rest.body = JSON.stringify(json); }
  const res = await fetch(path, { ...rest, headers });
  if (res.status === 401 && token) logout();
  return res;
}

/* ---- login ---- */
async function auth(kind) {
  const res = await api("/auth/" + kind, { method: "POST",
    json: { email: $("email").value.trim(), password: $("password").value } });
  const data = await res.json();
  if (!res.ok) {
    $("err").textContent = typeof data.detail === "string" ? data.detail : "Enter a valid email and a password of 8+ characters";
    return;
  }
  token = data.token;
  localStorage.setItem("token", token);
  start();
}

function logout() {
  token = null;
  localStorage.removeItem("token");
  $("app").classList.add("hidden");
  $("login").classList.remove("hidden");
}

async function start() {
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  loadDocs();
  const history = await (await api("/history")).json();
  if (!Array.isArray(history)) return;
  $("msgs").innerHTML = "";
  history.forEach((m) => addMsg(m.role, m.content, m.sources));
}

/* ---- documents ---- */
async function loadDocs() {
  const docs = await (await api("/documents")).json();
  if (!Array.isArray(docs)) return;
  $("docs").innerHTML = "";
  docs.forEach((d) => {
    const li = document.createElement("li");
    const name = document.createElement("span");
    name.textContent = d.filename;
    const del = document.createElement("button");
    del.textContent = "✕";
    del.onclick = async () => { await api("/documents/" + d.id, { method: "DELETE" }); loadDocs(); };
    li.append(name, del);
    $("docs").appendChild(li);
  });
}

$("file").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  $("status").textContent = "Uploading and indexing...";
  const form = new FormData();
  form.append("file", file);
  const res = await api("/documents", { method: "POST", body: form });
  const data = await res.json();
  $("status").textContent = res.ok ? `Done: ${data.chunks} chunks indexed` : data.detail;
  e.target.value = "";
  loadDocs();
});

/* ---- chat ---- */
function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  const body = document.createElement("div");
  body.className = "body";
  body.textContent = text;
  div.append(body);
  $("msgs").appendChild(div);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  return { body };
}

function showSources(box, sources) {
  box.innerHTML = "";
  sources.forEach((s) => {
    const d = document.createElement("details");
    const sum = document.createElement("summary");
    sum.textContent = `[${s.n}] ${s.file} · page ${s.page}`;
    const p = document.createElement("div");
    p.textContent = s.snippet;
    d.append(sum, p);
    box.appendChild(d);
  });
}

async function clearChat() {
  await api("/history", { method: "DELETE" });
  $("msgs").innerHTML = "";
}

async function send(question) {
  busy = true;
  addMsg("user", question);
  const bot = addMsg("assistant", "Thinking…");
  let first = true;
  try {
    const res = await api("/chat", { method: "POST", json: { question } });
    if (!res.ok) { bot.body.textContent = "Error: could not get an answer."; return; }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split("\n\n");   // each event:  data: {...}
      buffer = events.pop();
      for (const e of events) {
        const m = JSON.parse(e.slice(6));
        if (m.sources) showSources(bot.src, m.sources);
        if (m.token) {
          if (first) { bot.body.textContent = ""; first = false; }
          bot.body.textContent += m.token;
        }
        if (m.error) bot.body.textContent = m.error;
        $("msgs").scrollTop = $("msgs").scrollHeight;
      }
    }
  } finally {
    busy = false;
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q || busy) return;
  $("q").value = "";
  send(q);
});

if (token) start();
</script>
</body>
</html>
